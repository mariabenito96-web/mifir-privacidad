name: Generar clave de firma (solo una vez)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generar el keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Faltan los secrets KEYSTORE_PASSWORD, KEY_PASSWORD o KEY_ALIAS."
            echo "Créalos en Settings > Secrets and variables > Actions antes de ejecutar este workflow."
            exit 1
          fi
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias "$KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=MiFIR, OU=MiFIR, O=MiFIR, L=Madrid, S=Madrid, C=ES"
          base64 -w0 upload-keystore.jks > keystore-base64.txt

      - name: Subir el keystore como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: mifir-keystore
          path: |
            upload-keystore.jks
            keystore-base64.txt
