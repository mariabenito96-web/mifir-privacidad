name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Sin fijar versión: instala el último Flutter estable, necesario para
      # compilar contra Android 16 (API 36), obligatorio en Play Store desde
      # el 31/08/2026.
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Preparar la firma de release (si ya has generado tu clave)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF
            echo "Firma de release configurada."
          else
            echo "No hay KEYSTORE_BASE64 configurado todavía: se generará un APK/AAB firmado con la clave de debug (solo válido para pruebas, no para subir a Play Store)."
          fi

      - name: Build release APK
        run: flutter build apk --release

      - name: Build release App Bundle (para Play Store)
        run: flutter build appbundle --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fir-test-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB artifact (para subir a Play Console)
        uses: actions/upload-artifact@v4
        with:
          name: fir-test-aab
          path: build/app/outputs/bundle/release/app-release.aab
